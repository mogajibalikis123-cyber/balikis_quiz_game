<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BALQEES QUIZ CHALLENGE</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:22px;background:linear-gradient(135deg,#dff5ff,#b8dfff);font-family:Arial,sans-serif;color:#173b75;display:flex;align-items:center;justify-content:center}
.card{width:min(100%,480px);background:#fff;border-radius:24px;padding:28px 22px;box-shadow:0 12px 35px #173b7525}
h1{text-align:center;font-size:clamp(25px,7vw,34px);margin:0 0 8px;line-height:1.15}
.subtitle{text-align:center;color:#58749b;margin:0 0 24px}
button{border:0;border-radius:13px;background:#173b75;color:white;font-size:16px;font-weight:bold;padding:14px 22px;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{display:block;width:100%;margin-top:22px}
.progress{text-align:center;font-size:13px;font-weight:bold;letter-spacing:1px;margin:8px 0 18px}
.question{font-size:21px;line-height:1.35;text-align:center;margin:0 0 22px;color:#173b75}
.option{display:flex;align-items:flex-start;gap:12px;border:2px solid #c8d8eb;border-radius:13px;padding:14px;margin:11px 0;cursor:pointer;color:#243e63;line-height:1.35}
.option input{width:19px;height:19px;accent-color:#173b75;flex:none;margin:1px 0 0}
.option:has(input:checked){border-color:#173b75;background:#eef5ff}
.result{text-align:center}
.score{font-size:42px;font-weight:bold;margin:18px 0}
.hidden{display:none}
.small{font-size:14px;color:#58749b;text-align:center}
</style>
</head>
<body>
<main class="card">
<section id="welcome">
<h1>BALQEES<br>QUIZ CHALLENGE</h1>
<p class="subtitle">Test your computer science knowledge!</p>
<button class="primary" onclick="startQuiz()">START QUIZ</button>
</section>
<section id="quiz" class="hidden">
<h1 style="font-size:23px">BALQEES QUIZ CHALLENGE</h1>
<div class="progress" id="progress"></div>
<h2 class="question" id="question"></h2>
<div id="options"></div>
<button class="primary" id="next" onclick="nextQuestion()">NEXT</button>
</section>
<section id="result" class="hidden result">
<h1>QUIZ COMPLETED!</h1>
<p class="score" id="score"></p>
<p id="percentage"></p>
<button class="primary" onclick="startQuiz()">PLAY AGAIN</button>
</section>
</main>
<script>
const questions = [
{question:"1. What does HTML stand for?",options:["A. HyperText Markup Language","B. High Text Machine Language","C. Hyper Transfer Markup Language","D. Home Tool Markup Language"],answer:"A"},
{question:"2. Which language is used for Python programming?",options:["A. HTML","B. Python","C. CSS","D. SQL"],answer:"B"},
{question:"3. What does CPU stand for?",options:["A. Central Processing Unit","B. Computer Personal Unit","C. Central Program Utility","D. Control Processing User"],answer:"A"},
{question:"4. What does CSS stand for?",options:["A. Computer Style System","B. Cascading Style Sheets","C. Creative System Software","D. Coding Style Sheet"],answer:"B"},
{question:"5. What is the brain of the computer?",options:["A. Monitor","B. Keyboard","C. CPU","D. Mouse"],answer:"C"},
{question:"6. Which of these is an input device?",options:["A. Monitor","B. Printer","C. Speaker","D. Keyboard"],answer:"D"},
{question:"7. What does RAM stand for?",options:["A. Random Access Memory","B. Read Access Machine","C. Run All Memory","D. Random Application Mode"],answer:"A"},
{question:"8. Which of these is a web browser?",options:["A. Microsoft Word","B. Google Chrome","C. Python","D. Calculator"],answer:"B"},
{question:"9. Which digits are used in binary numbers?",options:["A. 1 and 2","B. 2 and 3","C. 0 and 1","D. 5 and 6"],answer:"C"},
{question:"10. What does URL stand for?",options:["A. Universal Reading Link","B. Uniform Resource Locator","C. United Resource Language","D. User Reference Link"],answer:"B"}
];
let current=0, score=0, selected="";
const $=id=>document.getElementById(id);
function startQuiz(){current=0;score=0;$("welcome").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");showQuestion();}
function showQuestion(){
selected="";const q=questions[current];
$("progress").textContent=`QUESTION ${current+1} OF ${questions.length}`;
$("question").textContent=q.question;$("options").innerHTML="";
q.options.forEach(option=>{
const letter=option.charAt(0),label=document.createElement("label");
label.className="option";
const radio=document.createElement("input");radio.type="radio";radio.name="answer";radio.value=letter;
radio.addEventListener("change",()=>selected=letter);
const span=document.createElement("span");span.textContent=option;
label.append(radio,span);$("options").appendChild(label);
});
$("next").textContent=current===questions.length-1?"FINISH QUIZ":"NEXT";
}
function nextQuestion(){
if(!selected){alert("Please select an answer before continuing.");return;}
if(selected===questions[current].answer)score++;
if(current===questions.length-1){showResult();return;}
current++;showQuestion();
}
function showResult(){
$("quiz").classList.add("hidden");$("result").classList.remove("hidden");
$("score").textContent=`${score} / ${questions.length}`;
$("percentage").textContent=`You scored ${score*10}%`;
}
</script>
</body>
</html>
